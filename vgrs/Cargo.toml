[package]
name = "vgrs"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
nb = "1.1.0"
panic-halt = "1.0.0"
rtt-target = { version = "0.3.1", features = ["cortex-m"] }
stm32l0xx-hal = { version = "0.10.0", features = ["mcu-STM32L072CBTx", "rt"] }
ssd1306 = { version = "0.8.3", features = ["graphics"] }
embedded-hal = "1.0.0"
display-interface-spi = "0.5.0"
embedded-time = "0.12.1"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 's'

[profile.dev]
codegen-units = 1
debug = true
opt-level = 's'
